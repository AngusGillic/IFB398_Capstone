name: travelly_flutter_ios_style
description: Travelly - sustainable travel companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  # 3.9 ships with Flutter 3.35, the first release with ClipRSuperellipse.
  # Below this the squircle corners will not compile.
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter_test:
    sdk: flutter
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  http: ^1.2.0

  # Amplify - pinned to stable (no more Kotlin/AAR errors)
    # Amplify - upgraded to support Android 36 SDK compiling
  amplify_flutter: ^2.11.0
  amplify_auth_cognito: ^2.11.0
  amplify_api: ^2.11.0
  amplify_datastore: ^2.11.0
  loading_animation_widget: ^1.3.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/gtfs/

# PLACEHOLDER ASSETS:
# Export real Figma assets into assets/images/ and replace the clearly marked placeholders.
# Search the codebase for: PLACEHOLDER_ASSET
